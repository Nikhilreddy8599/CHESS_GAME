<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Chess Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00ff00;
      font-family: monospace;
    }
  </style>
  <!-- Official CheerpJ 3.0 runtime loader -->
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3az.js"></script>
</head>
<body>
  <div id="status">Loading Java Runtime...</div>

  <script>
    async function launchGame() {
      try {
        await cheerpjInit();
        document.getElementById('status').style.display = 'none';
        cheerpjCreateDisplay(800, 800);
        await cheerpjRunJar("/app/Chess_game.jar");
      } catch (err) {
        document.getElementById('status').innerText = "Error launching game: " + err;
        console.error(err);
      }
    }

    // Ensure CheerpJ script is fully loaded before launching
    window.addEventListener('load', launchGame);
  </script>
</body>
</html>
